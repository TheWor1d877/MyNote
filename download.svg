<svg font-family="-apple-system-body, ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Helvetica, &quot;Apple Color Emoji&quot;, Arial, sans-serif, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;" font-weight="400" data-d-component="svg" fill="currentColor" style="color:rgb(237, 237, 237)" viewBox="0 0 780 880" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrblue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#3B82F6"/></marker><marker id="arrgreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#16A34A"/></marker><marker id="arrorange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#D97706"/></marker></defs><text x="17" y="25" font-size="12" fill="currentColor" font-weight="bold">高地址</text><text x="17" y="47" font-size="11" fill="currentColor">0xFFFFFFFF</text><rect x="125" y="35" width="620" height="105" rx="5" fill="#60A5FA" fill-opacity=".20" stroke="#3B82F6"/><text x="145" y="59" font-size="15" font-weight="bold" fill="#2563EB">Kernel Space（内核空间）</text><text x="145" y="82" font-size="12" fill="currentColor">1GB · 用户态程序不能直接访问</text><text x="145" y="105" font-size="11" fill="currentColor">内核代码、内核数据、内核映射</text><path d="M145 155 H745" stroke="#64748B" stroke-dasharray="4 3"/><text x="17" y="158" font-size="11" fill="currentColor">0xC0000000</text><text x="630" y="153" font-size="11" fill="currentColor">用户 / 内核边界</text><rect x="125" y="169" width="620" height="35" fill="#94A3B8" fill-opacity=".10" stroke="#94A3B8" stroke-dasharray="4 3"/><text x="145" y="192" font-size="11" fill="currentColor">Random Stack Offset（栈随机化区域）</text><rect x="125" y="204" width="620" height="83" rx="4" fill="#38BDF8" fill-opacity=".14" stroke="#0284C7"/><text x="145" y="226" font-size="14" font-weight="bold" fill="#0284C7">Stack（栈）</text><rect x="350" y="235" width="365" height="40" rx="4" fill="#0284C7" fill-opacity=".12" stroke="#0284C7"/><text x="360" y="251" font-size="11" fill="currentColor">main() 局部变量：</text><text x="360" y="267" font-size="11" fill="currentColor" font-weight="bold">Base* p = 0x09001000</text><path d="M715 220 V265" stroke="#0284C7" stroke-width="2" marker-end="url(#arrblue)"/><text x="145" y="278" font-size="10" fill="currentColor">栈向低地址增长 ↓</text><rect x="125" y="287" width="620" height="33" fill="#94A3B8" fill-opacity=".10" stroke="#94A3B8" stroke-dasharray="4 3"/><text x="145" y="308" font-size="11" fill="currentColor">Random mmap Offset（映射区域随机偏移）</text><rect x="125" y="320" width="620" height="105" rx="4" fill="#14B8A6" fill-opacity=".12" stroke="#0D9488"/><text x="145" y="343" font-size="14" font-weight="bold" fill="#0D9488">Memory Mapping Segment（mmap 区域）</text><text x="145" y="366" font-size="11" fill="currentColor">共享库、动态链接库、匿名映射等</text><text x="145" y="389" font-size="11" fill="currentColor">例如：libc.so、内存映射文件</text><text x="145" y="410" font-size="10" fill="currentColor">高地址方向的映射区域</text><rect x="125" y="425" width="620" height="28" fill="#94A3B8" fill-opacity=".10" stroke="#94A3B8" stroke-dasharray="4 3"/><text x="145" y="444" font-size="11" fill="currentColor">Random brk Offset</text><rect x="125" y="453" width="620" height="118" rx="4" fill="#22C55E" fill-opacity=".11" stroke="#16A34A"/><text x="145" y="478" font-size="14" font-weight="bold" fill="#16A34A">Heap（堆）</text><text x="145" y="497" font-size="11" fill="currentColor">动态分配对象，向高地址增长 ↑</text><rect x="355" y="502" width="360" height="58" rx="5" fill="#16A34A" fill-opacity=".13" stroke="#16A34A"/><text x="368" y="519" font-size="12" font-weight="bold" fill="currentColor">Derived 对象（0x09001000）</text><rect x="368" y="525" width="332" height="22" rx="3" fill="#3B82F6" fill-opacity=".15" stroke="#3B82F6"/><text x="375" y="540" font-size="11" fill="currentColor">vptr = 0x0804A020 → VTable</text><text x="368" y="556" font-size="10" fill="currentColor">成员变量 x = 41</text><text x="17" y="449" font-size="11" fill="currentColor">brk</text><text x="17" y="587" font-size="11" fill="currentColor">start_brk</text><rect x="125" y="571" width="620" height="53" rx="4" fill="#F59E0B" fill-opacity=".11" stroke="#D97706"/><text x="145" y="593" font-size="14" font-weight="bold" fill="#D97706">.bss（未初始化 / 零初始化全局与静态变量）</text><text x="145" y="611" font-size="11" fill="currentColor">程序加载时通常初始化为 0</text><rect x="125" y="624" width="620" height="48" rx="4" fill="#F59E0B" fill-opacity=".08" stroke="#D97706"/><text x="145" y="645" font-size="14" font-weight="bold" fill="#D97706">.data（已初始化全局与静态变量）</text><text x="145" y="662" font-size="11" fill="currentColor">start_data / end_data</text><rect x="125" y="672" width="620" height="80" rx="4" fill="#FBBF24" fill-opacity=".12" stroke="#D97706"/><text x="145" y="693" font-size="14" font-weight="bold" fill="#B45309">.rodata（只读数据段）</text><rect x="355" y="699" width="360" height="43" rx="4" fill="#F59E0B" fill-opacity=".15" stroke="#D97706"/><text x="368" y="716" font-size="12" font-weight="bold" fill="currentColor">Derived VTable（0x0804A020）</text><text x="368" y="735" font-size="11" fill="currentColor">func 槽位 → 0x08048120</text><rect x="125" y="752" width="620" height="115" rx="4" fill="#A78BFA" fill-opacity=".12" stroke="#8B5CF6"/><text x="145" y="776" font-size="14" font-weight="bold" fill="#7C3AED">.text（代码段 / ELF 指令）</text><text x="145" y="795" font-size="11" fill="currentColor">0x08048120 · Derived::func() 对应的机器指令示意</text><rect x="355" y="802" width="360" height="56" rx="4" fill="#8B5CF6" fill-opacity=".12" stroke="#8B5CF6"/><text x="368" y="819" font-size="11" fill="currentColor">LOAD r0, [this + offset(x)]</text><text x="368" y="835" font-size="11" fill="currentColor">ADD  r0, 1</text><text x="368" y="850" font-size="11" fill="currentColor">RET</text><text x="17" y="864" font-size="11" fill="currentColor">0x08048000</text><text x="17" y="888" font-size="12" fill="currentColor" font-weight="bold">0x00000000</text><path d="M745 547 H765 V720 H715" stroke="#3B82F6" stroke-width="2.2" fill="none" marker-end="url(#arrblue)"/><rect x="125" y="867" width="620" height="1" fill="#64748B"/><text x="435" y="883" font-size="10" fill="currentColor">低地址 ↑ 高地址（图示方向：自下而上）</text><path d="M715 738 V802" stroke="#D97706" stroke-width="2.2" fill="none" marker-end="url(#arrorange)"/></svg>